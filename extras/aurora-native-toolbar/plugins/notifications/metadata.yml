icon: IoNotificationsOutline
target: '@seelen/fancy-toolbar'
plugin:
  scopes:
  - Notifications
  template: "return [\n  dndActive ? icon(\"TbZzz\") : null,\n  count > 0 ? icon(\"MdNotificationsActive\") : icon(\"MdOutlineNotifications\"\
    ),\n]"
  badge: 'return count > 0 ? count : null'
  tooltip: 'return [t("placeholder.notifications"), ": ", count]'
  onClickV2: trigger("@seelen/notifications");
